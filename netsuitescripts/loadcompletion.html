<html>
  <head>
    <title>SuiteQL Completion Data Loader</title>
    <style>
      /* --- General Layout --- */
      body {
        margin: 0;
        padding: 0;
        font-family: "Arial", sans-serif;
        background-color: #f2f2f2;
      }

      .container {
        width: 80%;
        margin: 0 auto;
        text-align: center;
        padding-top: 20px;
      }

      /* --- Typography --- */
      .heading {
        font-size: 38px;
        font-weight: bold;
        margin-bottom: 20px;
        color: #333;
      }

      label {
        font-size: 20px;
        display: block;
        margin-bottom: 10px;
        font-weight: bold;
      }

      #status {
        font-size: 18px;
        margin: 20px auto;
        min-height: 24px; /* Prevent layout shift */
        color: #555;
      }

      /* --- Components --- */
      #myProgress {
        width: 100%;
        background-color: #ddd;
        margin: 20px auto;
        border-radius: 5px;
        overflow: hidden;
      }

      #myBar {
        width: 0%;
        height: 30px;
        background-color: #04aa6d;
        text-align: center;
        line-height: 30px;
        color: white;
        transition: width 0.3s ease;
      }

      textarea {
        width: 100%;
        padding: 10px;
        height: 400px;
        margin-bottom: 20px;
        resize: none;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-family: monospace;
      }

      /* --- Buttons --- */
      button {
        height: 40px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        margin: 0 auto;
        display: block;
        transition: background-color 0.2s;
      }

      .run-button {
        background-color: green;
        color: white;
        width: 100px;
      }
      .run-button:hover {
        background-color: darkgreen;
      }

      .copy-button {
        background-color: #007bff;
        color: white;
        width: 160px;
      }
      .copy-button:hover:not(:disabled) {
        background-color: #0056b3;
      }
      .copy-button:disabled {
        background-color: #ccc;
        color: #999;
        cursor: not-allowed;
      }
    </style>

    <script language="javascript">
      /**
       * Main Class to handle SuiteQL Metadata Loading
       */
      class SuiteQLMetadataLoader {
        constructor() {
          this.endpoint = "/app/recordscatalog/rcendpoint.nl";
          this.state = {
            currentIterTotal: 0,
            currentIterNum: 0,
            currentStage: "",
          };
          
          // DOM Elements cache
          this.ui = {
            bar: null,
            status: null,
            resultArea: null,
            copyBtn: null,
          };
        }

        init() {
          this.ui.bar = document.getElementById("myBar");
          this.ui.status = document.getElementById("status");
          this.ui.resultArea = document.getElementById("result_area");
          this.ui.copyBtn = document.getElementById("copyBtn");
        }

        // --- UI Methods ---

        updateUI() {
          const { currentIterTotal, currentIterNum, currentStage } = this.state;
          const percentage = currentIterTotal === 0 
            ? 0 
            : Math.round((currentIterNum / currentIterTotal) * 100);
          
          const percentString = `${percentage}%`;
          
          this.ui.bar.style.width = percentString;
          this.ui.bar.innerHTML = percentString;
          this.ui.status.innerHTML = currentStage;
        }

        setStage(stageName, totalItems) {
          this.state.currentStage = stageName;
          this.state.currentIterTotal = totalItems;
          this.state.currentIterNum = 0;
          this.updateUI();
        }

        incrementProgress() {
          this.state.currentIterNum++;
          this.updateUI();
        }

        // --- API / Network Methods ---

        async runRequest(action, data) {
          try {
            const url = `${this.endpoint}?action=${action}&data=${data}`;
            const response = await fetch(url);
            
            if (!response.ok) return { success: false };
            
            const result = await response.json();
            return { success: true, result };
          } catch (e) {
            console.error("Request Failed:", e);
            return { success: false };
          }
        }

        getRectype(urlString) {
            try {
                const url = new URL(urlString, "http://dummy");
                const rectype = url.searchParams.get("rectype");
                return rectype !== null ? rectype : "";
            } catch (e) {
                console.error("Invalid URL provided:", e);
                return "";
            }
        }   

        /**
         * Helper to fetch the internal numerical ID for a table/record.
         */
        async getRecordId(rec){
            try{
                //Use the direct endpoint instead of the N/url api.
                //This is faster and allows us to run async but it may be more brittle
                const requestUrl=`/app/common/scripting/ClientScriptHandler.nl?script=&deploy=&jrid=1&jrmethod=remoteObject.nlapiResolveURL&jrparams=["RECORD"%2C"${rec}"%2C1%2Cnull]`
                const result=await fetch(requestUrl);
                const body=await result.json();

                if(!body.result){
                   return '';
                }
                const resultUrl=body.result;
                return this.getRectype(resultUrl);
            } catch(e) {
                  return '';
            }
        }

        async loadRecordTypes() {
          const action = "getRecordTypes";
          const data = encodeURI(JSON.stringify({ structureType: "FLAT" }));
          const { success, result } = await this.runRequest(action, data);

          if (!success) return [];

          return result.data.map((t) => ({
            id: t.id.toLowerCase(),
            label: t.label,
          }));
        }

        async loadTableDetail(tableId) {
          const action = "getRecordTypeDetail";
          const data = encodeURI(
            JSON.stringify({ scriptId: tableId, detailType: "ss_anal" })
          );
          const { success, result } = await this.runRequest(action, data);

          if (!success) return { success: false };

          const fieldsData = result.data;
          
          // Process Fields
          const fields = fieldsData.fields.map((f) => ({
            id: f.id.toLowerCase(),
            label: f.label,
          }));

          // Process Joins
          const joins = fieldsData.joins.flatMap((join) => {
            // Direct ID join
            const idJoin = {
              id: join.sourceTargetType.id.toLowerCase(),
              label: join.label,
            };

            // Mapped pair joins
            const pairJoins = this.parseJoinPairs(
              tableId,
              join.label,
              join.sourceTargetType.joinPairs
            ).filter((f) => f.id !== idJoin.id);

            return pairJoins.concat([idJoin]);
          });

          this.incrementProgress();

          return {
            tId: tableId,
            success: true,
            fields,
            joins,
          };
        }

        parseJoinPairs(currentTable, joinLabel, joinPairs) {
          const allTableFields = joinPairs.reduce((acc, pair) => {
            const parts = pair.label.split("=").map((s) => s.trim());
            
            const tableObjs = parts.map((part) => {
              const [table, field] = part.split(".").map((s) => s.trim());
              return { table, field };
            });
            
            acc.push(...tableObjs);
            return acc;
          }, []);

          const tableFieldMap = allTableFields
            .filter((tf) => tf.table.toLowerCase() !== currentTable.toLowerCase())
            .reduce((acc, tf) => {
              if (!acc[tf.table]) {
                acc[tf.table] = {
                  id: tf.table.toLowerCase(),
                  label: tf.table.startsWith("MAP_") ? `Map ${joinLabel}` : joinLabel,
                  fields: [],
                };
              }
              
              acc[tf.table].fields.push({
                id: tf.field.toLowerCase(),
                label: tf.field,
              });
              
              return acc;
            }, {});

          return Object.values(tableFieldMap);
        }

        // --- Core Logic ---

        async processBatch(tablesToProcess, processedTableSet) {
          const tableFields = {};
          const newJoinedTables = [];
          
          // Create promises for all tables in this batch
          const promises = tablesToProcess.map((t) => this.loadTableDetail(t.id));
          const results = await Promise.all(promises);

          results.forEach(({ tId, success, fields, joins }) => {
            if (success) {
              tableFields[tId] = fields;
              
              joins
                .filter((f) => !processedTableSet.has(f.id))
                .forEach((f) => {
                  processedTableSet.add(f.id);
                  newJoinedTables.push(f);
                });
            }
          });

          return {
            tableFields,
            newJoinedTables,
          };
        }

        async start() {
          this.init(); // Ensure DOM is ready
          this.setStage("Loading Tables", 0);

          // Initial Load
          let tables = await this.loadRecordTypes();
          const processedTableSet = new Set(tables.map((t) => t.id));
          
          let allFieldsObject = {};
          let currentBatch = tables;
          let iterationCount = 0;

          // BFS Loop
          while (currentBatch.length > 0) {
            iterationCount++;
            
            const stageName = iterationCount === 1 
              ? "Loading Primary Table Fields" 
              : `Loading Join Fields: Stage ${iterationCount - 1}`;
              
            console.log(`Iteration ${iterationCount}: Processing ${currentBatch.length} tables`);
            this.setStage(stageName, currentBatch.length);

            const { tableFields, newJoinedTables } = await this.processBatch(
              currentBatch,
              processedTableSet
            );

            // Aggregate Results
            tables = tables.concat(
              newJoinedTables.map(({ id, label }) => ({ id, label }))
            );
            
            // Prepare next batch
            currentBatch = newJoinedTables;

            // Format fields from joins that have specific field definitions
            const specificJoinFields = newJoinedTables
              .filter((f) => f.fields !== undefined)
              .reduce((acc, ele) => {
                acc[ele.id] = ele.fields;
                return acc;
              }, {});

            allFieldsObject = { ...specificJoinFields, ...allFieldsObject, ...tableFields };
          }

          this.setStage("Resolving Numerical IDs", tables.length);
          
          // We use map to trigger all requests concurrently (up to browser limit)
          // instead of awaiting them one-by-one, which makes this much faster.
          const idPromises = tables.map(async (table) => {
            const numId = await this.getRecordId(table.id);
            // Assign the result to the new 'i' property
            table.i = numId; 
            this.incrementProgress();
          });

          // Wait for all ID requests to finish
          await Promise.all(idPromises);

          // Final Output
          const result = {
            tables,
            tableFields: allFieldsObject,
          };

          this.ui.resultArea.value = JSON.stringify(result);
          this.setStage("Done", 0);
          this.ui.copyBtn.disabled = false;
        }
      }

      // --- Global Functions for HTML Event Handlers ---

      const app = new SuiteQLMetadataLoader();

      function run() {
        app.start();
      }

      function copyToClipboard() {
        const textarea = document.getElementById("result_area");
        textarea.select();
        document.execCommand("copy");
      }
    </script>
  </head>
  <body>
    <div class="container">
      <h1 class="heading">SuiteQL Completion Data</h1>
      
      <div>
        <button class="run-button" type="button" onclick="run()">Run</button>
      </div>
      
      <h2 id="status">&nbsp;</h2>
      
      <div id="myProgress">
        <div id="myBar">0%</div>
      </div>
      
      <label for="result_area">Results</label>

      <textarea id="result_area" readonly></textarea>

      <button
        id="copyBtn"
        disabled
        class="copy-button"
        type="button"
        onclick="copyToClipboard()"
      >
        Copy to Clipboard
      </button>
    </div>
  </body>
</html>
